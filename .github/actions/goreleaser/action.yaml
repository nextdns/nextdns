name: "Run GoReleaser"
description: "Centralized action for running GoReleaser"
inputs:
  args:
    description: "Arguments to pass to GoReleaser"
    required: false
runs:
  using: "composite"
  steps:
    - name: Run GoReleaser
      uses: goreleaser/goreleaser-action@v6
      with:
        distribution: goreleaser-pro
        # >=2.14 emits define_method(:install) so brew style passes Sorbet/BlockMethodDefinition
        version: 2.20.2
        args: ${{ inputs.args }}
